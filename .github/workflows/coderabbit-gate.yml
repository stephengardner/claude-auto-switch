name: CodeRabbit gate

# Blocks a pull request while CodeRabbit still has unresolved critical or major
# findings, so "the review is done" is something the repository checks rather
# than something a person remembers to check.
#
# Treats "no review yet" as neutral rather than a failure: a gate that fails for
# reasons unrelated to the code teaches people to ignore it.
#
# ONE RUN PER COMMIT, deliberately. A required check is satisfied only when every
# check run of that name on the head commit is successful, so any extra run left
# in a non-success state blocks the merge forever. Both obvious ways of getting
# extra runs were tried here and both blocked a pull request that was genuinely
# ready:
#
#   Re-running on every comment left FAILED runs behind, from the moments when
#   findings were still open. PR #2 collected six and could not merge until each
#   was re-run by hand.
#
#   Adding `concurrency: cancel-in-progress` then left CANCELLED runs behind
#   instead, which count the same way. PR #4 blocked on exactly one of those.
#
# So the gate now fires only on the events that change the commit. Answering a
# finding without changing code (a `guard-ack`, or explaining why something is a
# false positive) needs the check refreshed afterwards:
#
#   gh run rerun --job "$(gh pr checks <pr> --json name,link ...)"   # or the UI
#
# Re-running UPDATES the existing check run rather than adding another, which is
# why that path is safe and adding triggers is not. In the common case there is
# nothing to do: fixing a finding means pushing a commit, and that starts a fresh
# run on its own.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  gate:
    name: coderabbit findings resolved
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out which pull request this is
        id: pr
        run: echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"

      - name: Check CodeRabbit findings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Waits for a review that is still running rather than failing because it
        # has not landed yet. Without waiting, this job fails on every push and
        # then relies on something re-running it once the review appears; when
        # that does not happen the pull request can never merge, and a gate that
        # deadlocks gets switched off rather than fixed.
        run: |
          set +e
          node scripts/coderabbit-guard.mjs "${{ steps.pr.outputs.number }}" --wait 900
          status=$?
          set -e
          case "$status" in
            0) echo "Clear to merge." ;;
            2) echo "::notice::No CodeRabbit review to check yet; not treating that as a failure." ;;
            *) echo "::error::CodeRabbit still has unresolved critical or major findings."; exit 1 ;;
          esac
