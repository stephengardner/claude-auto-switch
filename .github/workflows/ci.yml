name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # No repair of the install before the tests. node-pty ships its macOS
      # terminal helper without permission to run, and a step here once
      # restored it, so every test passed while a user's fresh install could
      # not start `claude` at all. ccx restores it itself now; the tests run on
      # the install exactly as npm laid it down.
      - run: npm run verify

  installed:
    # The package as a user gets it: packed, installed globally into a fresh
    # folder, then asked to run and to open a terminal. What the test suite
    # cannot see, because it runs from the repository.
    name: installed package (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack
      - name: Install it the way a user does
        shell: bash
        run: npm install -g --prefix "$RUNNER_TEMP/global" ./claude-auto-switch-*.tgz
      - name: Run it and open a terminal through it
        shell: bash
        run: node scripts/smoke-installed.mjs "$(npm root -g --prefix "$RUNNER_TEMP/global")/claude-auto-switch"
