name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # node-pty starts a terminal by running a small helper program that ships
      # prebuilt. On macOS that helper can arrive without permission to run,
      # and every attempt to open a terminal then fails with "posix_spawnp
      # failed", which took out the terminal tests here. Restoring the
      # permission is the actual fix; the diagnostic prints the truth if it is
      # ever something else.
      - name: Let node-pty run its terminal helper (macOS)
        if: runner.os == 'macOS'
        run: |
          for helper in node_modules/node-pty/prebuilds/*/spawn-helper node_modules/node-pty/build/Release/spawn-helper; do
            [ -e "$helper" ] || continue
            chmod +x "$helper"
            ls -l "$helper"
          done
          node -e "
            const { spawn } = require('node-pty');
            try {
              const p = spawn(process.execPath, ['-e', 'process.exit(0)'], { cwd: process.cwd(), env: process.env });
              p.kill();
              console.log('terminal check: a pseudo-terminal can be opened');
            } catch (e) {
              console.log('terminal check FAILED: ' + e.message);
              process.exitCode = 0; // report, do not fail the build here
            }
          "

      - run: npm run verify
